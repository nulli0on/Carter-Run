name: Extract ZIP files

on:
  workflow_dispatch:
  push:
    paths:
      - "**/*.zip"

permissions:
  contents: write

jobs:
  extract-zips:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract ZIP files
        shell: bash
        run: |
          set -euo pipefail

          found_zip=false

          while IFS= read -r -d '' zip_file; do
            found_zip=true

            echo "Processing: $zip_file"

            temp_dir="$(mktemp -d)"
            extract_dir="$temp_dir/extracted"
            mkdir -p "$extract_dir"

            unzip -q -o "$zip_file" -d "$extract_dir"

            current_dir="$extract_dir"

            # Remove unnecessary wrapper folders.
            #
            # Example:
            # Folder1/Folder2/File1.txt
            # Folder1/Folder2/File2.txt
            # Folder1/Folder2/Folder3/
            #
            # Becomes:
            # File1.txt
            # File2.txt
            # Folder3/
            while true; do
              mapfile -d '' entries < <(
                find "$current_dir" \
                  -mindepth 1 \
                  -maxdepth 1 \
                  ! -name "__MACOSX" \
                  ! -name ".DS_Store" \
                  -print0
              )

              if [[ ${#entries[@]} -eq 1 && -d "${entries[0]}" ]]; then
                current_dir="${entries[0]}"
                echo "Removing wrapper folder: $current_dir"
              else
                break
              fi
            done

            # Copy the final contents into the repository root.
            rsync -a \
              --exclude=".git/" \
              --exclude=".github/" \
              --exclude="*.zip" \
              "$current_dir/" "./"

            rm -rf "$temp_dir"

            # Delete the processed ZIP file.
            rm -f "$zip_file"
          done < <(
            find . \
              -type f \
              -name "*.zip" \
              -not -path "./.git/*" \
              -print0
          )

          if [[ "$found_zip" == false ]]; then
            echo "No ZIP files found."
          fi

      - name: Commit extracted files
        shell: bash
        run: |
          if git diff --quiet && [[ -z "$(git status --porcelain)" ]]; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "Extract ZIP contents"
          git push
