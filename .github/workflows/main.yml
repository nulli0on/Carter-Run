

name: Extract ZIP files

on:
  workflow_dispatch:
  push:
    paths:
      - "**/*.zip"

permissions:
  contents: write

jobs:
  extract-zips:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP files in their own folders
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          import shutil
          import stat
          import subprocess
          import tempfile
          import zipfile
          from pathlib import Path, PurePosixPath

          root = Path.cwd()

          result = subprocess.run(
              ["git", "ls-files", "-z", "--", "*.zip"],
              capture_output=True,
              check=True,
          )

          zip_files = sorted(
              root / os.fsdecode(name)
              for name in result.stdout.split(b"\0")
              if name
          )
          zip_paths = set(zip_files)

          if not zip_files:
              print("No ZIP files found.")

          for zip_path in zip_files:
              if not zip_path.is_file():
                  continue

              # IMPORTANT:
              # Extract beside the ZIP, NOT into root.
              destination = zip_path.parent

              print(f"Processing: {zip_path.relative_to(root)}")
              print(f"Destination: {destination.relative_to(root)}")

              with zipfile.ZipFile(zip_path) as archive:
                  entries = []

                  # Validate all paths before extraction.
                  for item in archive.infolist():
                      name = item.filename
                      if not name:
                          continue

                      parts = PurePosixPath(name).parts

                      if (
                          name.startswith("/")
                          or "\\" in name
                          or ".." in parts
                          or not parts
                          or ".git" in parts
                          or ".github" in parts
                          or ":" in parts[0]
                      ):
                          raise ValueError(
                              f"Unsafe ZIP path: {name}"
                          )

                      if (
                          "__MACOSX" in parts
                          or parts[-1] == ".DS_Store"
                      ):
                          continue

                      mode = (
                          item.external_attr >> 16
                      ) & 0o170000

                      if mode not in (
                          0, stat.S_IFREG, stat.S_IFDIR
                      ):
                          raise ValueError(
                              f"Unsupported ZIP entry: {name}"
                          )

                      target = destination.joinpath(*parts)

                      if target in zip_paths:
                          raise ValueError(
                              f"ZIP source conflict: {name}"
                          )

                      # Never follow existing symlinks.
                      for path in (target, *target.parents):
                          if path == root.parent:
                              break
                          if path.is_symlink():
                              raise ValueError(
                                  f"Symlink path: {name}"
                              )

                      # Reject file/directory conflicts.
                      if item.is_dir():
                          if target.exists() and not target.is_dir():
                              raise ValueError(
                                  f"Directory conflict: {name}"
                              )
                      elif target.is_dir():
                          raise ValueError(
                              f"File conflicts with directory: {name}"
                          )

                      entries.append((item, target))

                  # Extract into the ZIP's own folder.
                  for item, target in entries:
                      if item.is_dir():
                          target.mkdir(
                              parents=True,
                              exist_ok=True
                          )
                          continue

                      target.parent.mkdir(
                          parents=True,
                          exist_ok=True
                      )

                      if target.exists():
                          print(f"Updating: {target.relative_to(root)}")
                      else:
                          print(f"Creating: {target.relative_to(root)}")

                      temp_path = None
                      try:
                          with tempfile.NamedTemporaryFile(
                              dir=target.parent,
                              delete=False
                          ) as output:
                              temp_path = Path(output.name)
                              with archive.open(item) as source:
                                  shutil.copyfileobj(source, output)

                          os.replace(temp_path, target)

                      finally:
                          if temp_path is not None:
                              temp_path.unlink(missing_ok=True)

              # Remove only the processed ZIP.
              zip_path.unlink()
              print(f"Finished: {zip_path.name}")

          print("All ZIP files processed.")
          PY

      - name: Commit extracted files
        shell: bash
        run: |
          set -euo pipefail

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "Extract ZIP files in place"
          git push
