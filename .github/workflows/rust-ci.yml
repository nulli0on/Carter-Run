name: RUN CARTER Rust CI
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:
jobs:
  detect-source:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        shell: bash
        run: |
          if [[ -f Cargo.toml && -f src/main.rs ]]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Cannot compile: full game source has not been uploaded.'
          fi
  build-and-test:
    needs: detect-source
    if: needs.detect-source.outputs.ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: raylib dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang pkg-config libasound2-dev libx11-dev libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev libgl1-mesa-dev
      - name: Source audits
        run: |
          if [[ -f assets/office_original_textures_complete.glb && -f assets/carteros/desktop_bg.png ]]; then
            python3 tools/verify_v10.py
          else
            echo 'Protected artwork/office not uploaded; skipping corresponding hash audit.'
          fi
      - name: Third-party GLB audit
        run: |
          if [[ -f assets/arsenal/arms.glb ]]; then
            python3 tools/verify_arsenal_assets.py
          else
            echo 'Third-party models withheld pending redistribution-license review.'
          fi
      - name: Exact Figma PNG hash verification
        run: python3 tools/verify_carteros_artwork.py
      - name: Test Rust code
        run: cargo test
      - name: Compile release binary
        run: cargo build --release
      - name: Run game under virtual X11 display (startup smoke)
        shell: bash
        run: |
          sudo apt-get install -y xvfb xauth libgl1-mesa-dri
          set +e
          timeout --signal=TERM --kill-after=3s 8s \
            xvfb-run -a -s "-screen 0 1440x900x24" \
            env LIBGL_ALWAYS_SOFTWARE=1 ./target/release/run-carter \
            > /tmp/run-carter-smoke.log 2>&1
          result=$?
          set -e
          cat /tmp/run-carter-smoke.log
          if [ "$result" -eq 124 ]; then
            echo "PASS: game stayed running under a virtual display for 8 seconds."
          else
            echo "FAIL: game exited before the smoke test timeout (code $result)."
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: run-carter-linux-binary
          path: target/release/run-carter
          if-no-files-found: warn
