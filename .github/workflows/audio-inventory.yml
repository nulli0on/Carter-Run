name: Audio inventory audit
on:
  push:
    paths:
      - 'docs/AUDIO_INVENTORY_100.csv'
      - 'tools/check_audio_plan.py'
      - '.github/workflows/audio-inventory.yml'
  pull_request:
  workflow_dispatch:
jobs:
  verify-inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate 100-slot inventory status
        run: python3 tools/check_audio_plan.py
