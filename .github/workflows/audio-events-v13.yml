name: Rust audio event module tests
on:
  push:
    paths:
      - 'src/audio_events.rs'
      - '.github/workflows/audio-events-v13.yml'
  pull_request:
  workflow_dispatch:
jobs:
  rust-module:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Compile pure Rust audio event module and run 6 unit tests
        run: |
          rustc --edition=2021 --test src/audio_events.rs -o /tmp/audio-events-tests
          /tmp/audio-events-tests
      - name: Verify sound inventory counts
        run: python3 tools/check_audio_plan.py
