name: Export exact committed RUN CARTER source
on:
  push:
    branches: [feature/v18-viewmodel-qa]
  workflow_dispatch:
jobs:
  source-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Archive only Git-tracked source and approved assets
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=tar.gz --prefix=run-carter/ HEAD > run-carter-v18-source.tar.gz
          tar -tzf run-carter-v18-source.tar.gz | grep -q 'run-carter/src/main.rs'
          tar -tzf run-carter-v18-source.tar.gz | grep -q 'run-carter/assets/carteros/desktop_bg.png'
          ! tar -tzf run-carter-v18-source.tar.gz | grep -Eq 'assets/arsenal/.*\\.glb$|assets/sfx/imported/.*\\.mp3$'
          sha256sum run-carter-v18-source.tar.gz > source.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: run-carter-v18-exact-source
          path: |
            run-carter-v18-source.tar.gz
            source.sha256
          if-no-files-found: error
